le=\"dialog\" aria-modal=\"true\" aria-labelledby=\"routeTitle\"><button class=\"close\" onclick=\"closeModal()\" aria-label=\"Закрыть\">×<\/button><p class=\"eyebrow\">ВСЁ В ОДНОМ УРОКЕ<\/p><h2 id=\"routeTitle\">Маршрут на 50 минут<\/h2><div id=\"routeGrid\" class=\"map-grid\"><\/div><\/div><\/div>\n<div class=\"shade\" id=\"teacherModal\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"teacherTitle\"><button class=\"close\" onclick=\"closeModal()\" aria-label=\"Закрыть\">×<\/button><p class=\"eyebrow\">ПАНЕЛЬ ВЕДУЩЕГО<\/p><h2 id=\"teacherTitle\">План, таймер и методические подсказки<\/h2><div class=\"teacher-controls\"><span class=\"teacher-time\" data-total-timer>50:00<\/span><button class=\"primary\" onclick=\"toggleTimer()\" data-timer-action>▶ Начать<\/button><button onclick=\"resetTimer()\">↺ Сбросить таймер<\/button><button onclick=\"openPresenter()\">Открыть отдельно ↗<\/button><\/div><p class=\"small\" style=\"margin-top:9px\">Для онлайн-урока демонстрируй вкладку с заданиями. Отдельное окно ведущего оставь вне демонстрации.<\/p><div class=\"teacher-layout\"><div class=\"plan-list\" data-plan-list><\/div><div><div class=\"teacher-note\" data-teacher-note><\/div><div class=\"secret-preview\" data-secret-preview><\/div><div class=\"teacher-float\"><button onclick=\"go(index-1)\">← Предыдущий экран<\/button><button onclick=\"go(index+1)\">Следующий экран →<\/button><\/div><\/div><\/div><\/div><\/div>\n<div class=\"shade\" id=\"sourceModal\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Исходные страницы\"><button class=\"close\" onclick=\"closeModal()\" aria-label=\"Закрыть\">×<\/button><div class=\"ref-tabs\" id=\"sourceTabs\"><\/div><img id=\"sourceImage\" class=\"ref-img\" alt=\"Исходная страница учебника\"><\/div><\/div><\/div>\n<div class=\"shade\" id=\"infoModal\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"infoTitle\"><button class=\"close\" onclick=\"closeModal()\" aria-label=\"Закрыть\">×<\/button><h2 id=\"infoTitle\">Как провести онлайн-урок<\/h2><div class=\"info\"><p>Один HTML содержит план на 50 минут, оригинальные страницы 26–29, New Words 1, Text 1, задания 1–7, четыре аудиозаписи и поля для ответов. Раздел Ключи оставлен для домашней работы.<\/p><p>Открой «Учителю» → «Открыть отдельно», затем демонстрируй ученице только вкладку с заданиями. План и таймер в окне ведущего синхронизируются с основной вкладкой.<\/p><p>При демонстрации экрана ученица отвечает вслух, а преподаватель фиксирует ответы. Если платформа позволяет, передай ученице удалённое управление для письма и рисования. Отдельные копии файла на разных компьютерах автоматически друг с другом не синхронизируются.<\/p><p>После введения слов сразу идут два экрана контролируемой практики: значение слова и выбор слова в примере. У каждого нового иероглифа есть «Порядок черт» с анимацией и практикой письма.<\/p><p>Анимация: Hanzi Writer (MIT), данные Make Me a Hanzi (Arphic Public License); всё встроено в HTML.<\/p><p>В аудировании рисуй стрелки прямо на исходных часах. В фонетике сначала выбери тон, затем нажми на гласную. Свободные ответы и рисунки проверяются с преподавателем.<\/p><p>Аудио <a href=\"https://www.blcup.com/MobileResSeries?rid=65542fb7-d175-4436-94a2-786cd10cc10b\" target=\"_blank\" rel=\"noopener\">04-01–04-04: BLCUP<\/a> встроено в файл. Методический маршрут — адаптация коммуникативного планирования CELTA к китайскому языку; исходные учебные задания не заменены.<\/p><div style=\"display:flex;gap:12px;margin-top:18px\"><button class=\"primary\" onclick=\"exportAnswers()\">Скачать ответы<\/button><button class=\"soft\" onclick=\"document.getElementById('importFile').click()\">Загрузить ответы<\/button><\/div><input id=\"importFile\" type=\"file\" accept=\"application/json\" hidden onchange=\"importAnswers(this)\"><\/div><\/div><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div><\/div><\/div>\n<div id=\"presenterBoard\"><p class=\"eyebrow\" \": \"assets/114.jpg\", \"text-boy.jpg\": \"assets/114.jpg\"},AUDIOS=[{\"label\": \"04-01\", \"source\": \"https://www.blcup.com/File/Res3/52e4e578-a0ed-45f6-99ca-023010d81638.mp3\", \"data\": \"assets/29.mp3\"}, {\"label\": \"04-02\", \"source\": \"https://www.blcup.com/File/Res3/d663d6aa-5983-4047-8d1e-a7d8981e786a.mp3\", \"data\": \"assets/30.mp3\"}, {\"label\": \"04-03\", \"source\": \"https://www.blcup.com/File/Res3/68b326ab-1192-41e8-b493-ddeeb65bb14e.mp3\", \"data\": \"assets/31.mp3\"}, {\"label\": \"04-04\", \"source\": \"https://www.blcup.com/File/Res3/581b91bf-b306-401e-9b94-b5eaceb10ced.mp3\", \"data\": \"assets/32.mp3\"}];\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst asset=name=>ASSETS[name+'.jpg'];\nconst image=(name,alt,cl='')=>`<img class=\"${cl}\" src=\"${asset(name)}\" alt=\"${esc(alt)}\" draggable=\"false\">`;\nfunction clock(h,m){const end=(a,l)=>[100+l*Math.sin(a*Math.PI/180),100-l*Math.cos(a*Math.PI/180)];const hr=end((h%12+m/60)*30,44),mn=end(m*6,65);return `<svg class=\"clock\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Часы ${h}:${String(m).padStart(2,'0')}\"><circle class=\"face\" cx=\"100\" cy=\"100\" r=\"91\"/>${Array.from({length:60},(_,i)=>{const a=end(i*6,i%5?82:79),b=end(i*6,85);return `<line class=\"tick\" x1=\"${a[0]}\" y1=\"${a[1]}\" x2=\"${b[0]}\" y2=\"${b[1]}\"/>`}).join('')}${Array.from({length:12},(_,i)=>{const p=end((i+1)*30,70);return `<text class=\"digit\" x=\"${p[0]}\" y=\"${p[1]+3}\" text-anchor=\"middle\">${i+1}<\/text>`}).join('')}<line class=\"hand hour\" x1=\"100\" y1=\"100\" x2=\"${hr[0]}\" y2=\"${hr[1]}\"/><line class=\"hand minute\" x1=\"100\" y1=\"100\" x2=\"${mn[0]}\" y2=\"${mn[1]}\"/><circle class=\"hub\" cx=\"100\" cy=\"100\" r=\"4\"/><\/svg>`}\nconst audio=n=>`<div class=\"audio-box\"><div class=\"audio-row\"><span class=\"audio-label\">♫ ${n}<\/span><audio controls preload=\"metadata\" aria-label=\"Аудио ${n}\" src=\"${AUDIOS.find(a=>a.label===n).data}\"><\/audio><\/div><label>Скорость <select onchange=\"this.closest('.audio-box').querySelector('audio').playbackRate=Number(this.value)\"><option value=\".75\">0.75×<\/option><option selected value=\"1\">1×<\/option><option value=\"1.25\">1.25×<\/option><\/select><\/label><\/div>`;\nconst head=(label,title,en='',ru='',track='')=>`<div class=\"head\"><div><p class=\"eyebrow\">${label}<\/p><h2>${title}<\/h2>${en?`<p class=\"instruction\">${en}<\/p>`:''}${ru?`<p class=\"sub\">${ru}<\/p>`:''}<\/div>${track?audio(track):''}<\/div>`;\nconst KEYS={};function field(id,placeholder='Твой ответ…',answers=null,multi=false){if(answers)KEYS[id]=answers;return multi?`<textarea class=\"field\" data-field=\"${id}\" aria-label=\"${esc(placeholder)}\" placeholder=\"${esc(placeholder)}\"><\/textarea>`:`<input class=\"field\" data-field=\"${id}\" aria-label=\"${esc(placeholder)}\" placeholder=\"${esc(placeholder)}\" autocomplete=\"off\">`}\nconst PHASES=[\n{name:'Вход в ситуацию',range:'00–03',minutes:3,startSlide:0,goal:'Создать потребность спросить время и проверить исходные знания.',steps:['Покажи часы из примера задания 1, пока фраза скрыта.','Предложи ситуацию: нужно узнать время, а телефон разрядился.','Спроси: «Как нам узнать время у другого человека?» Дай ученице сначала попробовать самой.','При необходимости открой модель 现在几点了？ и попроси задать вопрос тебе.'],quote:'现在几点了？ → 现在两点。',check:'Что ученица уже может сказать без объяснения? Не разбирай всю грамматику на входе.',observe:'Контекст предшествует правилу. Ученица сначала пробует выразить смысл.'},\n{name:'Понимание текста',range:'03–09',minutes:6,startSlide:1,goal:'Понять вопрос и соотнести услышанное время с часами, затем проверить по тексту.',steps:['Оставь текст скрытым. Дай задачу до включения записи: «Какой вопрос задаёт мальчик?»','Включи 04-02 целиком. Прими короткий ответ по смыслу, без перевода каждого слова.','При повторном прослушивании ученица следит за пятью часами.','Открой текст кнопкой «Проверяю по тексту». Ученица сравнивает услышанное с написанным.'],quote:'Первый раз — понять вопрос. Второй раз — услышать конкретное время.',check:'«Сейчас только слушаем или читаем текст?» Не исправляй каждую незнакомую форму на этом этапе.',observe:'Задача перед аудио; переход от общего понимания к деталям.'},\n{name:'Смысл, форма, произношение',range:'09–18',minutes:9,startSlide:2,goal:'Вывести из примеров способы называть часы и минуты: 点、分、零、刻、半、两; понять вопрос с 了.',steps:['Переключай семь слов. Сначала ученица смотрит на часы и пример, затем объясняет смысл.','6:10: что обозначает 点, а что 分?','8:05: пять минут или пятьдесят? Почему нужно 零?','9:15: 一刻 — сколько минут? 11:30: 半 — сколько? 2:45: 三刻 — сколько?','Сопоставь 两点 и число 二. В этом уроке используем 两 перед 点.','Собери устную опору: 现在 + часы + 点 + минуты + 分. 一刻 = 十五分; 半 = 三十分; 三刻 = 四十五分.','Произнеси модели целиком. Отдельно проверь diǎn, fēn, líng, kè, bàn, liǎng и безударное le.'],quote:'了 в этом вопросе относится к текущей ситуации; это не показатель прошедшего времени. Все употребления 了 сейчас не объясняем.',check:'Проверяй значение конкретным выбором («8:05 или 8:50?»), а не вопросом «Всё понятно?».',observe:'Ученица выводит смысл из часов и примеров. Учитель направляет вопросами.'},\n{name:'Фонетика',range:'18–23',minutes:5,startSlide:3,goal:'Отработать финали uai, ui, iao, iu и место тонового знака в ui/iu.',steps:['Выполните исходную часть A: запись 04-03 → повторение → самостоятельное чтение.','Покажи правило B: когда i и u вместе, знак ставится над той гласной, которая идёт позже.','В исходной части B ученица слушает и ставит тоны: выбери тон в панели, затем нажми на гласную.','Проверь по записи с ученицей; повторите только трудные слоги.'],quote:'Инструкция: «Сначала выбери тон. Затем нажми на гласную».',check:'«Ставим знак над первой или над второй гласной в ui?» Для письменных ответов здесь нет автоматического ключа к аудиозаписи.',observe:'Произношение тренируется до более свободного обмена репликами.'},\n{name:'Контролируемая практика',range:'23–29',minutes:6,startSlide:4,goal:'Потренировать точные формы с опорой на исходные часы и закончить три разговора.',steps:['Экран «Работа с картинками»: ученица называет время по восьми исходным часам. При необходимости записывает ответ.','Сначала дай возможность исправиться: пауза, жест или повтор ошибочного фрагмента вопросительно.','Перейди к «Грамматика» — это тот же шестиминутный этап, таймер этапа не обнуляется.','Ученица самостоятельно вписывает три ответа: 07:15, 12:30, 16:05.','Разыграйте получившиеся разговоры. Если время позволяет, назовите второй вариант с 一刻 / 半.'],quote:'现在几点了？ → ответ ученицы, затем самокоррекция или проверка.',check:'Для 16:05 возможны 四点零五分 и 十六点零五分. Не добавляй обязательные новые слова «утро / вечер».',observe:'На этапе точности допустима немедленная, но экономная коррекция.'},\n{name:'Аудирование',range:'29–35',minutes:6,startSlide:6,goal:'Понять время на слух и нарисовать стрелки на восьми исходных часах.',steps:['До аудио проверь инструкцию: «Рисуем стрелки или пишем предложения?»','Включи 04-04: ученица рисует часовые и минутные стрелки. Цвет пера можно менять.','После первого прослушивания дай время заметить места, где она сомневается.','Повторное прослушивание — для проверки и исправления.','Обсудите результаты. Свободный рисунок проверяет учитель, не автоматический алгоритм.'],quote:'Сначала задача → слушаем и выполняем → слушаем для самопроверки.',check:'При онлайн-демонстрации можно передать ученице удалённое управление; иначе она диктует, куда поставить стрелки, а преподаватель рисует.',observe:'Учитель даёт время на самостоятельную попытку и проверку, а не сразу показывает ответ.'},\n{name:'Информационный пробел',range:'35–42',minutes:7,startSlide:7,goal:'Спросить время, чтобы действительно получить недостающую информацию.',steps:['Используйте только шесть исходных часов задания 6. Выбирай карточку по номеру.','Роль 1: ученица видит часы, учитель задаёт вопрос и записывает услышанное, не глядя на часы. Затем сверяют запись с картинкой.','Роль 2: нажми «Спрятать часы». Ученица видит знак вопроса и спрашивает 现在几点了？.','Тайная карточка видна преподавателю в отдельной панели ведущего. Он отвечает; ученица записывает услышанное.','Открой исходные часы и сравните ответ. Меняйтесь ролями.'],quote:'Один собеседник не видит часы. Вопрос нужен для получения информации.',check:'Сначала покажи один обмен репликами. Во время общения не прерывай ради каждой ошибки: записывай для обратной связи.',observe:'Настоящая разница в доступной информации; обе стороны спрашивают и отвечают.'},\n{name:'Самостоятельное применение',range:'42–47',minutes:5,startSlide:8,goal:'Без постоянной помощи назвать и записать время к шести исходным картинкам.',steps:['Прикрой языковые подсказки: на этом экране они не показаны.','Ученица сама записывает время к шести картинкам задания 7, затем проговаривает ответы.','Наблюдай за выбором форм: 一刻, 半, 零 и 两. Не подсказывай каждое слово.','Если письмо занимает слишком много времени: устно пройдите все шесть картинок, письменное завершение оставь на дом без изменения задания.'],quote:'Ученица выбирает подходящий способ назвать время самостоятельно.',check:'В 14:00 можно сказать 两点 или 十四点; в 21:30 — 九点半 или 二十一点半. Не считай правильный альтернативный вариант ошибкой.',observe:'Постепенное снятие опор. В центре внимания — самостоятельность ученицы.'},\n{name:'Обратная связь',range:'47–50',minutes:3,startSlide:9,goal:'Показать результат, исправить одну-две важные ошибки и закончить успешным ответом.',steps:['Сначала отметь конкретный удачный пример: сама использовала 零, назвала 半 или задала вопрос.','Запиши в поля одну-две услышанные ошибки; предложи ученице их исправить. Не добавляй новые грамматические правила.','Покажи одни из уже знакомых часов. Ученица задаёт вопрос и отвечает без языковой опоры.','Назначь задание 4 Ключи на function initCanvases(){$$('canvas[data-canvas]').forEach(canvas=>{const id=canvas.dataset.canvas,ctx=canvas.getContext('2d');function paint(){ctx.clearRect(0,0,340,340);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#557e68';ctx.lineWidth=7;for(const line of state.drawings[id]||[]){ctx.beginPath();line.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}}paint();let down=false;const point=e=>{const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)*340/b.width,(e.clientY-b.top)*340/b.height]};canvas.onpointerdown=e=>{if(e.button>0)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);down=true;(state.drawings[id]||=[]).push([point(e)])};canvas.onpointermove=e=>{if(down){state.drawings[id].at(-1).push(point(e));paint()}};canvas.onpointerup=canvas.onpointercancel=()=>{down=false;save()}})}

document.addEventListener('pointerdown',e=>{const chip=e.target.closest('[data-drag-value],[data-build-id]');if(!chip||e.button>0)return;const b=chip.getBoundingClientRect();const ghost=chip.cloneNode(true);ghost.removeAttribute('onclick');ghost.classList.add('ghost');Object.assign(ghost.style,{width:b.width+'px',height:b.height+'px',left:e.clientX-b.width/2+'px',top:e.clientY-b.height/2+'px'});document.body.append(ghost);drag={ghost,token:chip.dataset.dragValue,id:chip.dataset.buildId,w:b.width,h:b.height,x:e.clientX,y:e.clientY,moved:false};chip.setPointerCapture(e.pointerId)});

const ORIGIN_RU={
'上':'Указательный знак: короткая отметка находится над опорной линией. Сравни с 下 — «внизу».',
'下':'Указательный знак: короткая отметка находится под опорной линией. Образует наглядную пару с 上.',
'不':'Одно из палеографических объяснений связывает раннюю форму с чашечкой цветка. Отрицательное значение возникло позднее; картинка «птица под небом» — традиционная, но не единственная трактовка.',
'两':'Современная упрощённая форма 兩. Происхождение древнего рисунка обсуждается: существуют трактовки через парные элементы и повозки. Не сводим историю к современной форме.',
'中':'На древних формах видят древко с отметками; встречается объяснение через знамя или сигнальный барабан. Поздний разбор «линия через центр рамки» удобен для запоминания, но не исчерпывает историю.',
'么':'Вариант 幺. В 什么 это часть слова shénme; происхождение отдельного знака и современное значение всего слова не совпадают.',
'也':'Древний рисунок трактуют по-разному. Поэтому здесь показаны образцы, а не одна якобы бесспорная история. В нашем слове 也 означает «тоже».',
'了':'В «Шовэнь цзецзы» форму сравнивают с изображением ребёнка, отличающимся от 子. Связь с «закончить» и современными грамматическими функциями — отдельный исторический вопрос.',
'人':'Рисунок стоящего человека в профиль: выделены рука и нога. Левая форма 亻 развилась как вариант компонента в составе других знаков.',
'什':'В современной форме видны 亻 и 十. В 什么 знак читается shén; его нельзя переводить отдельно и затем механически складывать значения.',
'今':'Для раннего рисунка предложены разные толкования, в том числе связанные с ртом и речью. Современное «сейчас» нельзя надёжно вывести из одних печатных черт.',
'他':'Смысловая часть 亻 «человек» и историческая звуковая часть 也. Более ранним связанным написанием считается 佗.',
'们':'Упрощение 們: человек 亻 + звуковая часть 門, упрощённая до 门. В 我们 суффикс образует множественное число.',
'兄':'Древнюю композицию связывают с человеком и выделенным ртом. Традиционное толкование — старший брат, отдающий распоряжения младшим.',
'再':'Происхождение спорное: существует несколько гипотез. Не выдаём рисунок «две рыбы» или другую мнемонику за установленный факт.',
'分':'Композиция 八 «разделять» и 刀 «нож»: идея разделения ножом. Значение «минута» — одно из более поздних употреблений.',
'刻':'Смысловой компонент ножа 刂 и звуковой компонент 亥. Ранний смысл связан с резанием, нанесением зарубок; в уроке слово обозначает четверть часа.',
'午':'Ранний рисунок связывают с пестом — орудием для толчения. Значение «полдень» не следует из современного внешнего сходства с 干.',
'半':'Традиционный разбор связывает знак с разделением: 八 и 牛. В нашем уроке 半 означает половину часа.',
'口':'Изначально изображение открытого рта. В 口 как счётном слове для членов семьи используется другое, развившееся употребление.',
'叫':'口 указывает на речь и голос, 丩 служит исторической звуковой частью. В раннем словаре значение объясняется как «кричать».',
'名':'Традиционная история: назвать себя голосом 口 в темноте 夕. Есть и другая палеографическая трактовка роли 夕; это не бесспорная буквальная сцена.',
'吗':'Современное упрощение 嗎. В традиционной форме 口 связано с речью, 馬 — звуковая часть. История вопросительной частицы отличается от истории самого начертания.',
'和':'Исторически связан со смыслом гармонии, в том числе музыкальной. 禾 служит звуковой частью; древние связанные варианты могли содержать компонент духового инструмента.',
'哥':'Составлен из двух 可. Раннее значение связывают с пением; современное «старший брат» не означает буквально «два рта».',
'多':'Ранние формы объясняют как удвоенное изображение мяса. Позже компоненты стали похожи на 夕. Поэтому история «две ночи» — не единственное и не самое раннее объяснение.',
'大':'Изображение человека с разведёнными руками, передающее идею большого размера. Сравни с профильным изображением человека 人.',
'她':'Знак с 女 существовал и раньше, но его использование как отдельного женского местоимения «она» закрепилось в начале XX века. Древнее начертание и современная функция местоимения — не одно и то же.',
'好':'Древняя композиция 女 и 子. Связь с матерью и ребёнком — распространённое объяснение; точный исходный смысл трактуется по-разному.',
'妈':'Упрощение 媽: 女 указывает на женское лицо, 馬 исторически подсказывает звук. Это не рисунок «женщина с лошадью».',
'妹':'女 — смысловая часть, 未 — историческая звуковая. В слове 妹妹 второй слог нейтральный.',
'姐':'女 — смысловая часть, 且 — историческая звуковая. Древние значения и чтение не полностью совпадают с современным jiě.',
'姓':'女 — смысловой компонент, 生 — звуковой. Сам знак связан с обозначением фамилии; история фамилий шире истории одного иероглифа.',
'字':'宀 «крыша» — смысловая часть, 子 исторически участвует в передаче звучания. Популярная картинка «ребёнок под крышей» не заменяет звукового анализа.',
'家':'В ранней форме под крышей был компонент, связанный с изображением кабана, участвовавший в передаче звучания. Позднее он сблизился с 豕. История «просто свинья в доме» слишком упрощает развитие знака.',
'岁':'Упрощение 歲. Древние формы содержали элементы, связанные с движением и 戉; современная композиция 山＋夕 не воспроизводит древнюю историю буквально.',
'差':'Раннюю форму связывают с зерном и рукой, растирающей зёрна; это связано с более ранним значением, близким к 搓. История «овца плохо работает» — мнемоника, а не надёжная этимология.',
'年':'На древних формах — человек, несущий зерно. Смысл урожая связан с годовым циклом; позднее форма изменилась в канцелярском письме.',
'弟':'Древний рисунок объясняют как рукоять, обмотанную ремнём. Идея последовательности связывается с более поздним значением младшего брата.',
'很':'Смысловая часть 彳 и историческая звуковая часть 艮. Современное hěn не обязано совпадать с современным чтением звукового компонента.',
'早':'У ранних и поздних форм есть разные объяснения. Палеографические трактовки отличаются от простой истории «первые лучи солнца». На поздних формах виден 日; подробности и варианты даны в источнике.',
'晚':'日 — смысловая часть, 免 — историческая звуковая. Современное значение «вечер; поздно» не означает буквально «избегать солнца».',
'没':'Упрощённая форма 沒. Исторически знак связан с компонентом воды; отрицательное употребление 没有 — отдельное развитие значения.',
'点':'Упрощённая форма 點: в традиционной форме 黑 связано со значением, 占 подсказывает звук. Современные 灬 в 点 не дают полного исторического разбора.',
'爸':'父 — смысловая часть «отец», 巴 — историческая звуковая. В 爸爸 второй слог произносится нейтрально.',

function structureBox(ids){const paths={'⿰':'M50 0V100','⿱':'M0 50H100','⿲':'M33 0V100M66 0V100','⿳':'M0 33H100M0 66H100','⿴':'M18 18H82V82H18Z','⿵':'M20 100V22H80V100','⿸':'M22 100V25H100','⿺':'M25 0V75H100'};return `<svg class="structure-box" viewBox="0 0 100 100"><rect x="1" y="1" width="98" height="98" fill="#fffdf8" stroke="#b1c5b0"/><path d="${paths[ids]||paths['⿰']}" fill="none" stroke="#779076" stroke-width="2" stroke-dasharray="5 4"/></svg>`}
let m1Tone=1;const TONE_LETTERS={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù','ü':'ǖǘǚǜ'};
function toneLetter(id,i,j,k,l){return state.answers[id+':tone:'+i+':'+j+':'+k]||l}
function setM1Tone(i,j,k){const c=card(),l=[...c.rows[i].split(' ')[j]][k];if(!TONE_LETTERS[l])return;state.answers[c.id+':tone:'+i+':'+j+':'+k]=[...TONE_LETTERS[l]][m1Tone-1];save();render()}

function m1Discover(c){const examples={'1b':['我有十个好朋友。','我有三个朋友。'],'2a':['一年有十二个月。','今天八月二十号。'],'2b':['今天九月二十二号，星期天。','今天是我的生日。'],'3a':['我二〇〇八年出生。','我在上海出生。我现在住在北京。'],'3b':['昨天几号？','明天星期几？祝你生日快乐！']};return `<div class="body discovery"><div class="panel discovery-examples">${examples[group].map(s=>`<p class="zh">${s}</p>`).join('')}</div><div class="panel discovery-prompts"><h3>Что ты заметила?</h3><p>${{'1b':'Где стоит 有? Какое слово между числом и 朋友?','2a':'Как сказать «январь» и «один месяц»? В каком порядке стоят месяц и число?','2b':'В каком порядке дата и день недели? Когда есть 是?','3a':'Где стоят год и место по отношению к 出生? Как строится фраза с 住?','3b':'Что заменяет 几? Кому адресовано поздравление после 祝?'}[group]}</p>${field(c.id+':rule','Сформулируй правило')}<button onclick="showLexNote()">Сверить правило</button></div></div>`}
function m1Freer(c){const tasks={'1a':['Секретное число','Учитель задумал число от 1 до 10. Назови варианты по-китайски, затем поменяйтесь ролями. После этого продиктуйте друг другу последовательности из трёх чисел.','numbers'],'1b':['У кого сколько друзей?','Выберите разные картинки людей. Не показывая свою, назови количество друзей: 我有……个好朋友。 Собеседник выбирает подходящую картинку. Поменяйтесь ролями.','friends'],'2a':['Выбираем дату встречи','У каждого свой календарь. Предложите и запишите дату встречи. Сначала назовите её по-китайски, затем проверьте, одинаково ли вы поняли месяц и число.','calendar'],'2b':['Календарь дней рождения','Учитель и ученица называют придуманные даты дней рождения с днями недели. Запишите их в общий календарь и выберите, кого поздравите первым.','birthday'],'3a':['Интервью о себе','Собеседники выбирают себе персонажа: год рождения, место рождения и город, где он живёт. Представь своего персонажа, затем расскажи, что узнала о персонаже учителя.','shanghai'],'3b':['Звонок в день рождения','Начните с даты и дня недели, узнайте день рождения собеседника и поздравьте его. Не читайте готовый диалог — реагируйте на ответы друг друга.','birthday']};const [title,task,art]=tasks[group];return `<div class="body panel m1-free"><div>${picture(art,title,'m1-free-image')}</div><div><h3>${title}</h3><p>${task}</p>${field(c.id+':plan','Заметки для разговора')}<button class="soft" onclick="m1FreeSupport()">Нужна опора?</button></div></div>`}

// Shared board, including the retained time lesson. Vector records are saved per exercise.
let boardKey='',boardTool='pen',boardColor='#294b3d',boardWidth=4,boardStroke=null;
const boardState={};try{Object.assign(boardState,JSON.parse(localStorage.getItem('module2-board-v1')||'{}'))}catch(e){}
const board=document.createElement('section');board.id='lessonBoard';board.setAttribute('role','dialog');board.setAttribute('aria-label','Доска для записей');board.innerHTML=`<div class="board-toolbar"><strong>Доска</strong><button data-board-tool="pen" onclick="setBoardTool('pen')">✎ Перо</button><button data-board-tool="eraser" onclick="setBoardTool('eraser')">Ластик</button><button data-board-tool="text" onclick="setBoardTool('text')">Текст</button><input id="boardText" aria-label="Текст для доски" placeholder="Напиши текст, затем нажми на доску"><input id="boardColor" type="color" value="#294b3d" aria-label="Цвет пера" oninput="boardColor=this.value"><select aria-label="Толщина пера" onchange="boardWidth=Number(this.value)"><option value="2">Тонкое</option><option value="4" selected>Среднее</option><option value="8">Толстое</option></select><button onclick="boardUndo()">↶</button><button onclick="boardClear()">Очистить</button><button onclick="board.classList.toggle('over-task')">Фон</button><button onclick="saveBoardImage()" title="Сохранить рисунок">↓ PNG</button><button onclick="closeBoard()" aria-label="Закрыть доску">×</button></div><canvas id="boardCanvas" width="1600" height="900" aria-label="Рисуй мышью или пальцем"></canvas><span class="board-status" role="status">Записи сохраняются для этого задания</span>`;document.body.append(board);
const boardCanvas=document.getElementById('boardCanvas'),boardCtx=boardCanvas.getContext('2d');
function persistBoard(){try{localStorage.setItem('module2-board-v1',JSON.stringify(boardState))}catch(e){notice('Не удалось сохранить доску в этом браузере.')}}
function boardRecords(){return boardState[boardKey]||(boardState[boardKey]=[])}
function openBoard(key){boardKey=typeof key==='string'?key:(group&&card()?card().id:'home');board.classList.add('open');setBoardTool('pen');paintBoard();document.querySelector('#lessonBoard [data-board-tool="pen"]').focus()}
function closeBoard(){boardStroke=null;persistBoard();board.classList.remove('open')}
function setBoardTool(tool){boardTool=tool;board.querySelectorAll('[data-board-tool]').forEach(b=>b.classList.toggle('selected',b.dataset.boardTool===tool));boardCanvas.style.cursor=tool==='text'?'text':'crosshair';document.getElementById('boardText').style.display=tool==='text'?'':'none'}
function paintBoard(){boardCtx.clearRect(0,0,1600,900);for(const item of boardRecords()){boardCtx.globalCompositeOperation=item.tool==='eraser'?'destination-out':'source-over';boardCtx.fillStyle=item.color;boardCtx.strokeStyle=item.color;boardCtx.lineWidth=item.width;boardCtx.lineCap='round';boardCtx.lineJoin='round';if(item.tool==='text'){boardCtx.font=`${item.size||36}px "Microsoft YaHei", "Segoe UI", sans-serif`;boardCtx.fillText(item.text,item.x,item.y);continue}const pts=item.points;if(!pts?.length)continue;boardCtx.beginPath();boardCtx.moveTo(...pts[0]);if(pts.length===1)boardCtx.lineTo(pts[0][0]+.1,pts[0][1]+.1);else pts.slice(1).forEach(p=>boardCtx.lineTo(...p));boardCtx.stroke()}boardCtx.globalCompositeOperation='source-over'}
function boardPoint(e){const r=boardCanvas.getBoundingClientRect();return [(e.clientX-r.left)*1600/r.width,(e.clientY-r.top)*900/r.height]}
boardCanvas.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();const [x,y]=boardPoint(e);if(boardTool==='text'){const text=document.getElementById('boardText').value.trim();if(!text){document.getElementById('boardText').focus();return}boardRecords().push({tool:'text',text,x,y,color:boardColor,size:32+boardWidth*2});paintBoard();persistBoard();return}boardCanvas.setPointerCapture(e.pointerId);boardStroke={tool:boardTool,color:boardColor,width:boardTool==='eraser'?boardWidth*7:boardWidth,points:[[x,y]]};boardRecords().push(boardStroke);paintBoard()});
boardCanvas.addEventListener('pointermove',e=>{if(!boardStroke)return;e.preventDefault();boardStroke.points.push(boardPoint(e));paintBoard()});
function endBoardStroke(){if(boardStroke){boardStroke=null;persistBoard()}}['pointerup','pointercancel','lostpointercapture'].forEach(name=>boardCanvas.addEventListener(name,endBoardStroke));
function boardUndo(){boardRecords().pop();paintBoard();persistBoard()}
function boardClear(){if(!boardRecords().length)return;if(!confirm('Очистить записи на доске этого задания?'))return;boardState[boardKey]=[];paintBoard();persistBoard()}

 }
 if(scope==='all'){
  const frame=document.getElementById('oldFrame');
  if(frame?.contentWindow&&frame.srcdoc){try{frame.contentWindow.clearCourseAnswers()}catch(e){}frame.srcdoc=OLD}

 }
 selectedMatch=null;selectedToken=null;save();closeModal();if(group)render();notice('Ответы сброшены');

let cpShown=false,cpListenSaid=false;
function cpWords(){return CP_WORDS[group]||[]}
function cpRound(){return Math.min(state.rounds[card().id]||0,cpWords().length-1)}
function cpKey(suffix='choice'){return card().id+':'+cpRound()+':'+suffix}
function cpChange(n){state.rounds[card().id]=n;cpShown=false;cpListenSaid=false;save();render()}
function cpChoices(n){const ws=cpWords(),ids=[n,...ws.map((_,i)=>i).filter(i=>i!==n).slice(0,3)];return ids.sort((a,b)=>(a*7+n*3)%13-(b*7+n*3)%13)}
function cpVoice(){return window.speechSynthesis?.getVoices().find(v=>/^zh[-_](CN|SG|Hans)/i.test(v.lang))||window.speechSynthesis?.getVoices().find(v=>/^zh/i.test(v.lang))}
function cpSay(){const v=cpVoice();if(!v){notice('Китайский голос недоступен. Выполни вариант с пиньинем.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cpWords()[cpRound()][0]);u.voice=v;u.lang=v.lang;u.rate=.75;cpListenSaid=true;speechSynthesis.speak(u)}
function cpSelect(i){state.answers[cpKey()]=i;save();render();const ok=i===cpRound();if(ok)reward()}
function cpClean(s){return String(s).normalize('NFKC').replace(/[\s，。！？、,.!?]/g,'')}
function cpCheckWrite(){const input=document.querySelector('#cpWrite'),ok=cpClean(input?.value||'')===cpClean(cpWords()[cpRound()][0]);input?.classList.toggle('correct',ok);input?.classList.toggle('incorrect',!ok);document.querySelector('#cpFeedback').textContent=ok?'Верно! Прочитай вслух.':'Проверь порядок иероглифов. Можно ещё раз открыть образец.';if(ok)reward()}
function cpTiles(){return [...cpWords()[cpRound()][0]]}
function cpPlace(tile,slot){const a=JSON.parse(val(cpKey('tiles'))||'[]'),old=a.indexOf(tile);if(old>=0){a[old]=a[slot]??null}a[slot]=tile;state.answers[cpKey('tiles')]=JSON.stringify(a);save();render()}
function cpTileClick(tile){const a=JSON.parse(val(cpKey('tiles'))||'[]');if(a.includes(tile)){a[a.indexOf(tile)]=null;state.answers[cpKey('tiles')]=JSON.stringify(a);save();render();return}cpPlace(tile,cpTiles().findIndex((_,i)=>a[i]===undefined||a[i]===null))}
function cpCheckTiles(){const a=JSON.parse(val(cpKey('tiles'))||'[]'),letters=cpTiles(),ok=letters.every((ch,i)=>letters[a[i]]===ch);document.querySelector('#cpFeedback').textContent=ok?'Верно! Прочитай вслух.':'Переставь иероглифы и попробуй ещё.';if(ok)reward()}
function cpStrip(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function cpToneOptions(py){const marks=['āáǎà','ēéěè','īíǐì','ōóǒò','ūúǔù','ǖǘǚǜ'];let position=-1,row='';for(let i=0;i<py.length;i++){row=marks.find(r=>r.includes(py[i].toLowerCase()));if(row){position=i;break}}if(position<0)return [py,py+'́',py+'̀'];return [py,...[...row].filter(ch=>ch!==py[position]).map(ch=>py.slice(0,position)+ch+py.slice(position+1))]}
function cpToneChoose(i){const opts=cpToneOptions(cpWords()[cpRound()][1]);state.answers[cpKey('tone')]=i;save();render();if(i===0)reward()}

 if(c.mode==='assemble'){const chars=cpTiles(),a=JSON.parse(val(cpKey('tiles'))||'[]');body=`<div class="cp-prompt"><p>${esc(w[2])}</p><p class="cp-pinyin">${esc(w[1])}</p><small>Перетащи иероглифы в клетки. Можно нажимать на карточки.</small></div><div class="cp-slots">${chars.map((_,i)=>`<button class="cp-slot zh" data-cp-slot="${i}" onclick="${a[i]!==undefined&&a[i]!==null?'cpTileClick('+a[i]+')':''}">${a[i]!==undefined&&a[i]!==null?esc(chars[a[i]]):'·'}</button>`).join('')}</div><div class="cp-bank">${chars.map((_,i)=>chars.length-1-i).filter(i=>!a.includes(i)).map(i=>`<button class="cp-tile zh" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','cp:'+${i})" onclick="cpTileClick(${i})">${esc(chars[i])}</button>`).join('')}</div><button class="primary" onclick="cpCheckTiles()">Проверить</button>`}
 if(c.mode==='tone'){const opts=cpToneOptions(w[1]),selected=val(cpKey('tone'));body=`<div class="cp-prompt"><strong class="cp-hanzi zh">${esc(w[0])}</strong><p>${esc(w[2])}</p><small>Выбери пиньинь с правильными тонами.</small></div><div class="cp-options">${[...opts.keys()].sort((a,b)=>(a*5+n*3)%7-(b*5+n*3)%7).map(i=>`<button class="${selected===i?(i===0?'correct':'incorrect'):''}" onclick="cpToneChoose(${i})">${esc(opts[i])}</button>`).join('')}</div>`}
 if(c.mode==='label'){const wrong=(n+1)%ws.length;body=`<div class="cp-prompt"><div class="cp-labelcue">${cpIllustration(w[0])}<div><p class="cp-meaning">${esc(w[2])}</p><strong class="cp-wrong zh">${esc(ws[wrong][0])}</strong><small>Подпись неверна. Выбери правильную замену.</small></div></div></div><div class="cp-options">${cpChoices(n).map(i=>`<button class="zh ${choice===i?(i===n?'correct':'incorrect'):''}" onclick="cpSelect(${i})">${esc(ws[i][0])}</button>`).join('')}</div>`}
 if(c.mode==='recall'){body=`<div class="cp-prompt"><p>${esc(w[2])}</p><div class="cp-memory zh">${cpShown?esc(w[0]):'？'}</div><button onclick="cpShown=!cpShown;render()">${cpShown?'Спрятать образец':'Посмотреть образец'}</button><small>Посмотри, спрячь и напиши по памяти.</small></div><div class="cp-recall"><input id="cpWrite" class="field zh" data-answer="${cpKey('write')}" value="${esc(val(cpKey('write')))}" oninput="state.answers[this.dataset.answer]=this.value;save()" placeholder="Напиши иероглифами" aria-label="Ответ иероглифами"><button class="primary" onclick="cpCheckWrite()">Проверить</button></div>`}
 return `<div class="body panel cp-extra"><div class="round-tabs">${ws.map((_,i)=>`<button class="${i===n?'primary':'soft'}" onclick="cpChange(${i})">${i+1}</button>`).join('')}</div>${body}<p id="cpFeedback" aria-live="polite">${['label','listen'].includes(c.mode)&&choice!==''?(correct?'Верно! Прочитай вслух.':'Попробуй ещё.'):''}</p><div class="cp-bottom"><span>${n+1} / ${ws.length}</span><button onclick="cpChange(${n+1})" ${n===ws.length-1?'disabled':''}>Следующий пример →</button>${group==='4a'?'<button onclick="openOld()">← К уроку о времени</button>':''}</div></div>`
}
